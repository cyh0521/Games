<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隻字片語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e5e5;
    --border-strong: #d4d4d4;
    --text: #171717;
    --text-soft: #525252;
    --text-mute: #a3a3a3;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --accent-hover: #134e4a;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --success: #059669;
    --success-soft: #d1fae5;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --cell: 54px;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .layout {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .title-block {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--text);
    color: white;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .status-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    min-width: 92px;
    text-align: center;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: 1.5px;
    font-weight: 500;
    margin-bottom: 2px;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value.warning { color: var(--danger); }

  /* ========== 棋盤 ========== */
  .board-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .board-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-soft);
    letter-spacing: 3px;
  }

  .board-legend {
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--text-mute);
  }
  .board-legend span {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .grid-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    padding: 8px 0;
  }

  .col-labels {
    display: flex;
    padding-left: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-mute);
  }
  .col-labels span {
    width: var(--cell);
    text-align: center;
  }

  .grid-row-wrap {
    display: flex;
    align-items: center;
  }

  .row-labels {
    display: flex;
    flex-direction: column;
  }
  .row-labels div {
    height: var(--cell);
    line-height: var(--cell);
    width: 28px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-mute);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    background: var(--border);
    gap: 1px;
    padding: 1px;
    border-radius: 4px;
  }

  .cell {
    background: var(--surface);
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    position: relative;
  }

  .cell:hover:not(.filled) {
    background: #f5f5f5;
  }

  .cell.filled {
    background: var(--surface);
    cursor: pointer;
  }

  .cell.filled:hover {
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .cell.start {
    background: var(--warning-soft);
    color: var(--warning);
    font-weight: 700;
  }

  .cell.recent {
    animation: placed 0.6s ease-out;
  }

  .cell.preview {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }

  .cell.selected-anchor {
    background: var(--accent);
    color: white;
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--accent-hover);
  }

  /* 拖曳中：滑鼠按下的第一格 */
  .cell.drag-start {
    background: var(--accent);
    color: white;
    font-weight: 700;
  }

  /* 拖曳中：合法路徑的預覽格（空格） */
  .cell.drag-valid {
    background: var(--accent-soft);
    color: var(--accent-hover);
  }
  /* 拖曳中：合法路徑上已有字的格子（會被重疊檢查） */
  .cell.drag-valid-existing {
    background: #a7f3d0;
    color: var(--accent-hover);
    font-weight: 700;
  }

  /* 拖曳中：非法路徑 */
  .cell.drag-invalid {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .grid {
    user-select: none;
    -webkit-user-select: none;
  }
  .grid.dragging {
    cursor: crosshair;
  }

  @keyframes placed {
    0% { background: var(--success-soft); transform: scale(1.08); }
    100% { background: var(--surface); transform: scale(1); }
  }

  /* ========== 側邊欄 ========== */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }

  .panel-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-mute);
    font-weight: 600;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .hint-text {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.6;
    background: var(--accent-soft);
    padding: 10px 12px;
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
  }
  .hint-text strong {
    color: var(--accent-hover);
    font-weight: 600;
  }

  .anchor-info {
    background: var(--warning-soft);
    border: 1px solid #fde68a;
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 10px;
    display: none;
  }
  .anchor-info.show { display: block; }
  .anchor-info .label {
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 1.5px;
    margin-bottom: 2px;
    text-transform: uppercase;
  }
  .anchor-info .char {
    font-size: 22px;
    font-weight: 700;
    color: var(--warning);
    margin-right: 8px;
  }
  .anchor-info .coord {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-mute);
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 6px;
    color: var(--text);
    text-align: center;
    font-weight: 500;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field-label {
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    font-weight: 500;
    text-transform: uppercase;
  }

  .field-group {
    margin-bottom: 12px;
  }

  .picker {
    display: grid;
    gap: 4px;
  }
  .picker.dir { grid-template-columns: repeat(3, 1fr); }
  .picker.pos { grid-template-columns: repeat(4, 1fr); }

  .picker button {
    aspect-ratio: 1;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-soft);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.1s;
    font-family: inherit;
  }
  .picker button:hover:not(:disabled) {
    background: #f5f5f5;
    border-color: var(--text-mute);
  }
  .picker button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .picker button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .picker button.center {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-mute);
  }

  .btn {
    width: 100%;
    padding: 11px 14px;
    border: none;
    border-radius: var(--radius);
    background: var(--text);
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn:hover:not(:disabled) {
    background: #000;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn.primary {
    background: var(--accent);
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .btn.secondary {
    background: var(--surface);
    color: var(--text-soft);
    border: 1px solid var(--border-strong);
  }
  .btn.secondary:hover:not(:disabled) {
    background: #f5f5f5;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .history-list {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-item {
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-item .word {
    font-weight: 500;
    letter-spacing: 1px;
  }
  .history-item .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
  }
  .history-empty {
    color: var(--text-mute);
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }

  /* ========== 訊息 toast ========== */
  .message {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    padding: 10px 20px;
    background: var(--text);
    color: white;
    font-size: 14px;
    border-radius: var(--radius);
    z-index: 100;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    letter-spacing: 1px;
  }
  .message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .message.error { background: var(--danger); }
  .message.success { background: var(--success); }

  /* ========== 載入 ========== */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-size: 14px;
    color: var(--text-mute);
    letter-spacing: 2px;
  }
  #loading.hidden { display: none; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
</style>
</head>
<body>

<div id="loading">載入中…</div>
<div class="message" id="message"></div>

<div class="layout">
  <header>
    <div class="title-block">
      <div class="logo">隻</div>
      <div>
        <h1>隻字片語</h1>
        <div class="subtitle">單人練習 · v1.5</div>
      </div>
    </div>
    <div class="status-row">
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">—</div>
      </div>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board-header">
      <h2>字 盤</h2>
      <div class="board-legend">
        <span><span class="legend-dot" style="background:#fef3c7;"></span>起始字</span>
        <span><span class="legend-dot" style="background:#0f766e;"></span>拖曳起點／共用字</span>
        <span><span class="legend-dot" style="background:#ccfbf1;"></span>合法路徑</span>
        <span><span class="legend-dot" style="background:#fee2e2;"></span>不合法</span>
      </div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">How to Play</div>
      <div class="hint-text" id="hintText">
        <strong>快速模式</strong>：先在下方輸入成語，然後在字盤上按住滑鼠拖曳出一條 4 格路徑（直、橫、對角皆可），放開即落子。<br>
        <strong>手動模式</strong>：點選任一已有字作為共用字，再指定第幾字與方向後送出。
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">作 答</div>

      <div class="anchor-info" id="anchorInfo">
        <div class="label">共用字</div>
        <span class="char" id="anchorChar">—</span>
        <span class="coord" id="anchorPos"></span>
      </div>

      <div class="field-group">
        <div class="field-label">成語</div>
        <input type="text" id="idiomInput" placeholder="輸入四字成語" maxlength="4" autocomplete="off" spellcheck="false">
      </div>

      <div class="field-group">
        <div class="field-label">共用字是第幾字</div>
        <div class="picker pos" id="posPicker">
          <button data-pos="1">1</button>
          <button data-pos="2">2</button>
          <button data-pos="3">3</button>
          <button data-pos="4">4</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">延伸方向</div>
        <div class="picker dir" id="dirPicker">
          <button data-dir="NW">↖</button>
          <button data-dir="N">↑</button>
          <button data-dir="NE">↗</button>
          <button data-dir="W">←</button>
          <button class="center" disabled>·</button>
          <button data-dir="E">→</button>
          <button data-dir="SW">↙</button>
          <button data-dir="S">↓</button>
          <button data-dir="SE">↘</button>
        </div>
      </div>

      <button class="btn primary" id="submitBtn">送 出</button>
      <div class="btn-row">
        <button class="btn secondary" id="cancelBtn">取消選取</button>
        <button class="btn secondary" id="restartBtn">重新開局</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">作答紀錄</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">尚無紀錄</div>
      </div>
    </div>
  </div>
</div>

function showMessage(text, type = 'info', duration = 2000) {
  const el = $('message');
  el.textContent = text;
  el.className = 'message show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), duration);
}

// ====== 資料準備 ======
function prepareIdioms() {
  state.idiomSet = new Set(IDIOM_LIST);
  state.charIndex = {};
  for (const idiom of IDIOM_LIST) {
    for (const ch of idiom) {
      (state.charIndex[ch] = state.charIndex[ch] || []).push(idiom);
    }
  }
}

// ====== 棋盤渲染 ======
function renderGrid() {
  const container = $('gridContainer');
  container.innerHTML = '';

  const colLabels = document.createElement('div');
  colLabels.className = 'col-labels';
  for (let i = 0; i < COLS; i++) {
    const s = document.createElement('span');
    s.textContent = COL_LABELS[i];
    colLabels.appendChild(s);
  }
  container.appendChild(colLabels);

  const rowWrap = document.createElement('div');
  rowWrap.className = 'grid-row-wrap';

  const rowLabels = document.createElement('div');
  rowLabels.className = 'row-labels';
  for (let y = 0; y < ROWS; y++) {
    const d = document.createElement('div');
    d.textContent = y + 1;
    rowLabels.appendChild(d);
  }
  rowWrap.appendChild(rowLabels);

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.id = 'grid';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      // 起點：按下開始拖曳（pointerdown）
      cell.addEventListener('pointerdown', e => onCellPointerDown(e, x, y));
      grid.appendChild(cell);
    }
  }
  // 整個文件監聽 pointermove / pointerup
  // 用 document.elementFromPoint 找出滑鼠當下所在的 cell（比 pointerenter 可靠）
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', cancelDrag);
  rowWrap.appendChild(grid);
  container.appendChild(rowWrap);
}

function refreshGrid() {
  const grid = $('grid');
  if (!grid) return;
  [...grid.children].forEach(cell => {
    const x = +cell.dataset.x;
    const y = +cell.dataset.y;
    const row = state.board[y];
    const c = row ? row[x] : null;
    cell.classList.remove(
      'filled', 'start', 'recent', 'preview', 'selected-anchor',
      'drag-start', 'drag-valid', 'drag-valid-existing', 'drag-invalid'
    );
    cell.textContent = '';
    if (c) {
      cell.textContent = c.char;
      cell.classList.add('filled');
      if (c.turn === 0) cell.classList.add('start');
      if (state.recentCells.some(r => r.x === x && r.y === y)) {
        cell.classList.add('recent');
      }
    }
    if (state.anchor && state.anchor.x === x && state.anchor.y === y) {
      cell.classList.add('selected-anchor');
    }
  });
  renderPreview();
  renderDragPreview();
}

function renderPreview() {
  const input = $('idiomInput').value.trim();
  if (!state.anchor || !state.direction || !state.anchorPos || input.length === 0) return;
  const { x: ax, y: ay } = state.anchor;
  const { dx, dy } = DIRECTIONS[state.direction];
  const startX = ax - dx * (state.anchorPos - 1);
  const startY = ay - dy * (state.anchorPos - 1);
  for (let i = 0; i < 4 && i < input.length; i++) {
    const x = startX + dx * i;
    const y = startY + dy * i;
    if (!inBounds(x, y)) continue;
    const existing = state.board[y][x];
    if (!existing) {
      const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
      if (cell) {
        cell.classList.add('preview');
        cell.textContent = input[i] || '';
      }
    }
  }
}

// ====== 拖曳模式 ======
// 從 (sx,sy) 到 (ex,ey) 計算路徑
// 回傳 { ok, path, complete, reason }
//   ok=true & complete=true：剛好 4 格的合法路徑（可以送出）
//   ok=true & complete=false：方向合法但格數 < 4（拖曳進行中，用於預覽）
//   ok=false：方向錯誤（不是直線/對角）或超過 4 格
function computeDragPath(sx, sy, ex, ey) {
  const totalDx = ex - sx;
  const totalDy = ey - sy;

  // 起點與終點相同：視為只有 1 格的部分路徑
  if (totalDx === 0 && totalDy === 0) {
    return { ok: true, complete: false, path: [{ x: sx, y: sy }] };
  }

  // 判斷是否為合法方向
  const isHorizontal = totalDy === 0;
  const isVertical = totalDx === 0;
  const isDiagonal = Math.abs(totalDx) === Math.abs(totalDy);
  if (!(isHorizontal || isVertical || isDiagonal)) {
    return { ok: false, reason: '必須是直線或 45° 對角' };
  }

  const distance = Math.max(Math.abs(totalDx), Math.abs(totalDy));
  if (distance > 3) {
    return { ok: false, reason: `距離超過 4 格（目前 ${distance + 1} 格）` };
  }

  const dx = totalDx === 0 ? 0 : totalDx / Math.abs(totalDx);
  const dy = totalDy === 0 ? 0 : totalDy / Math.abs(totalDy);

  // 建立從起點到當前位置的所有格子（含頭尾）
  const path = [];
  for (let i = 0; i <= distance; i++) {
    path.push({ x: sx + dx * i, y: sy + dy * i });
  }

  return {
    ok: true,
    complete: distance === 3,  // 剛好 4 格才算完成
    path,
    dx,
    dy,
  };
}

function onCellPointerDown(e, x, y) {
  // 必須先輸入 4 字成語才能啟動拖曳模式；否則 fallback 到點選模式
  const idiom = $('idiomInput').value.trim();
  if (idiom.length !== 4) {
    // 走舊的點選模式
    onCellClick(x, y);
    return;
  }
  e.preventDefault();
  state.drag.active = true;
  state.drag.startX = x;
  state.drag.startY = y;
  state.drag.endX = x;
  state.drag.endY = y;
  state.drag.path = [{ x, y }];  // 起點單格
  state.drag.pathComplete = false;
  state.drag.invalidReason = null;
  // 清除手動模式的選取，避免混淆
  state.anchor = null;
  state.direction = null;
  state.anchorPos = null;
  updateAnchorInfo();
  updateDirectionButtons();
  updatePosButtons();
  $('grid').classList.add('dragging');
  refreshGrid();
}

// 從螢幕座標找出當下在哪個 cell 上（支援滑鼠與觸控）
function cellAtPoint(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  if (!el) return null;
  const cell = el.closest('.cell');
  if (!cell || !cell.dataset.x) return null;
  return { x: +cell.dataset.x, y: +cell.dataset.y };
}

function onPointerMove(e) {
  if (!state.drag.active) return;
  const pt = cellAtPoint(e.clientX, e.clientY);
  if (!pt) return;
  if (pt.x === state.drag.endX && pt.y === state.drag.endY) return;
  state.drag.endX = pt.x;
  state.drag.endY = pt.y;
  const result = computeDragPath(state.drag.startX, state.drag.startY, pt.x, pt.y);
  if (result.ok) {
    state.drag.path = result.path;
    state.drag.pathComplete = result.complete;
    state.drag.invalidReason = null;
  } else {
    state.drag.path = null;
    state.drag.pathComplete = false;
    state.drag.invalidReason = result.reason;
  }
  refreshGrid();
}

function renderDragPreview() {
  if (!state.drag.active) return;
  const { startX, startY, endX, endY, path, pathComplete } = state.drag;
  const idiom = $('idiomInput').value.trim();

  // 起點格：當路徑僅有 1 格（尚未移動）時，只標起點
  if (path && path.length === 1) {
    const cell = document.querySelector(`.cell[data-x="${startX}"][data-y="${startY}"]`);
    if (cell) {
      cell.classList.add('drag-start');
      const existing = state.board[startY] && state.board[startY][startX];
      if (!existing) cell.textContent = idiom[0] || '';
    }
    return;
  }

  if (path) {
    // 部分或完整路徑：逐格標示並顯示對應的字
    // path[i] 對應成語的第 i 個字
    path.forEach((p, i) => {
      const cell = document.querySelector(`.cell[data-x="${p.x}"][data-y="${p.y}"]`);
      if (!cell) return;
      const existing = state.board[p.y] && state.board[p.y][p.x];
      const char = idiom[i] || '';

      if (existing) {
        // 已有字
        if (existing.char === char) {
          // 成語字與現有字吻合
          cell.classList.add('drag-valid-existing');
        } else {
          // 衝突：現有字與成語不符
          cell.classList.add('drag-invalid');
        }
      } else {
        // 空格：顯示預覽字
        if (i === 0) {
          cell.classList.add('drag-start');
        } else {
          cell.classList.add('drag-valid');
        }
        cell.textContent = char;
      }
    });
  } else {
    // 非法（例如超過 4 格或不在直線上）：只標終點為紅色
    if (endX !== null && endY !== null && (endX !== startX || endY !== startY)) {
      const endCell = document.querySelector(`.cell[data-x="${endX}"][data-y="${endY}"]`);
      if (endCell) endCell.classList.add('drag-invalid');
    }
    // 起點保持標記
    const startCell = document.querySelector(`.cell[data-x="${startX}"][data-y="${startY}"]`);
    if (startCell) {
      startCell.classList.add('drag-start');
      const existing = state.board[startY] && state.board[startY][startX];
      if (!existing) startCell.textContent = idiom[0] || '';
    }
  }
}

function onPointerUp() {
  if (!state.drag.active) return;
  const path = state.drag.path;
  const complete = state.drag.pathComplete;
  const reason = state.drag.invalidReason;
  const idiom = $('idiomInput').value.trim();

  const grid = $('grid');
  if (grid) grid.classList.remove('dragging');

  state.drag.active = false;

  // 方向錯誤（reason 有值）→ 顯示錯誤
  if (!path) {
    if (reason) showMessage(reason, 'error');
    state.drag.path = null;
    state.drag.pathComplete = false;
    refreshGrid();
    return;
  }

  // 方向對但未滿 4 格 → 靜默取消（不彈錯誤，讓玩家可以隨意放開重試）
  if (!complete) {
    state.drag.path = null;
    state.drag.pathComplete = false;
    refreshGrid();
    return;
  }

  // 完整 4 格路徑：送出驗證
  submitAnswerWithPath(idiom, path);
  state.drag.path = null;
  state.drag.pathComplete = false;
}

function cancelDrag() {
  if (!state.drag.active) return;
  state.drag.active = false;
  state.drag.path = null;
  const grid = $('grid');
  if (grid) grid.classList.remove('dragging');
  refreshGrid();
}

// ====== 遊戲流程 ======
function startGame() {
  state.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  state.turn = 0;
  state.history = [];
  state.anchor = null;
  state.direction = null;
  state.anchorPos = null;
  state.recentCells = [];

  const candidates = Object.entries(state.charIndex)
    .filter(([, ids]) => ids.length >= 30)
    .map(([ch]) => ch);
  const startChar = candidates[Math.floor(Math.random() * candidates.length)];

  const x = 4 + Math.floor(Math.random() * 4);
  const y = 3 + Math.floor(Math.random() * 2);
  state.board[y][x] = { char: startChar, turn: 0 };
  state.recentCells = [{ x, y }];

  updateScore();
  renderHistory();
  refreshGrid();
  clearSelection();
  $('idiomInput').value = '';
  showMessage(`開局字：「${startChar}」 於 ${COL_LABELS[x]}${y + 1}`, 'info', 2500);
  startTimer();
}

function updateScore() {
  $('score').textContent = state.turn;
}

function renderHistory() {
  const list = $('historyList');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="history-empty">尚無紀錄</div>';
    return;
  }
  list.innerHTML = '';
  state.history.slice().reverse().forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const dirName = h.direction && DIRECTIONS[h.direction] ? DIRECTIONS[h.direction].name : '·';
    item.innerHTML = `
      <span class="word">${h.idiom}</span>
      <span class="meta">${h.anchorChar || ''} ${dirName}</span>
    `;
    list.appendChild(item);
  });
}

function startTimer() {
  stopTimer();
  state.timeLeft = 60;
  updateTimer();
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) {
      stopTimer();
      onTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

function updateTimer() {
  const el = $('timer');
  el.textContent = state.timeLeft;
  el.className = 'stat-value' + (state.timeLeft <= 10 ? ' warning' : '');
}

function onTimeout() {
  showMessage('時間到！重新開局', 'error', 2500);
  setTimeout(startGame, 1200);
}

// ====== 互動 ======
function onCellClick(x, y) {
  const c = state.board[y][x];
  if (!c) {
    showMessage('請點選已有字的格子', 'error');
    return;
  }
  state.anchor = { x, y, char: c.char };
  state.direction = null;
  state.anchorPos = null;
  updateAnchorInfo();
  updateDirectionButtons();
  updatePosButtons();
  refreshGrid();
  $('idiomInput').focus();
}

function updateAnchorInfo() {
  const info = $('anchorInfo');
  if (!state.anchor) { info.classList.remove('show'); return; }
  info.classList.add('show');
  $('anchorChar').textContent = state.anchor.char;
  $('anchorPos').textContent =
    `@ ${COL_LABELS[state.anchor.x]}${state.anchor.y + 1}`;
}

function updateDirectionButtons() {
  document.querySelectorAll('#dirPicker button[data-dir]').forEach(btn => {
    btn.classList.remove('active');
    btn.disabled = !state.anchor;
    if (btn.dataset.dir === state.direction) btn.classList.add('active');
  });
}

function updatePosButtons() {
  document.querySelectorAll('#posPicker button[data-pos]').forEach(btn => {
    btn.classList.remove('active');
    btn.disabled = !state.anchor;
    if (+btn.dataset.pos === state.anchorPos) btn.classList.add('active');
  });
}

function clearSelection() {
  state.anchor = null;
  state.direction = null;
  state.anchorPos = null;
  updateAnchorInfo();
  updateDirectionButtons();
  updatePosButtons();
  refreshGrid();
}

document.querySelectorAll('#dirPicker button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!state.anchor) return;
    state.direction = btn.dataset.dir;
    updateDirectionButtons();
    refreshGrid();
  });
});

document.querySelectorAll('#posPicker button[data-pos]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!state.anchor) return;
    state.anchorPos = +btn.dataset.pos;
    updatePosButtons();
    refreshGrid();
  });
});

$('idiomInput').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\s/g, '');
  refreshGrid();
});

$('idiomInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

$('cancelBtn').addEventListener('click', clearSelection);
$('restartBtn').addEventListener('click', startGame);
$('submitBtn').addEventListener('click', submitAnswer);

// ====== 作答驗證 ======

// 核心：拿到 idiom + 4 格 positions，做驗證並落子
// 成功回傳 true，失敗回傳 false 並顯示錯誤訊息
function commitIdiom(idiom, positions, meta) {
  // meta 是方向與 anchorPos 資訊（用於紀錄）
  if (idiom.length !== 4) {
    showMessage('請輸入四個字', 'error');
    return false;
  }
  if (!state.idiomSet.has(idiom)) {
    showMessage(`「${idiom}」不在成語庫中`, 'error');
    return false;
  }

  // 路徑上必須至少有一格是已存在的字（拖曳模式下可能起終都是空格，但中間必須至少一格對應到現有字）
  let hasAnchor = false;
  for (let i = 0; i < 4; i++) {
    const p = positions[i];
    if (!inBounds(p.x, p.y)) {
      showMessage('超出字盤邊界', 'error');
      return false;
    }
    const existing = state.board[p.y][p.x];
    if (existing) {
      if (existing.char !== idiom[i]) {
        showMessage(
          `${COL_LABELS[p.x]}${p.y + 1} 已有「${existing.char}」，與「${idiom[i]}」衝突`,
          'error'
        );
        return false;
      }
      hasAnchor = true;
    }
  }

  // 新成語必須至少接到一個現有字（不能在空白處憑空寫一個成語）
  // 第一手除外（但第一手是系統給的開局字，玩家不會遇到這個情境）
  if (!hasAnchor) {
    showMessage('新成語必須與現有字相連', 'error');
    return false;
  }

  if (state.history.some(h => h.idiom === idiom)) {
    showMessage(`「${idiom}」已經寫過了`, 'error');
    return false;
  }

  // 通過所有驗證，落子
  state.turn++;
  state.recentCells = [];
  for (let i = 0; i < 4; i++) {
    const p = positions[i];
    if (!state.board[p.y][p.x]) {
      state.board[p.y][p.x] = { char: idiom[i], turn: state.turn };
      state.recentCells.push({ x: p.x, y: p.y });
    }
  }

  state.history.push({
    idiom,
    direction: meta.direction,
    anchorPos: meta.anchorPos,
    anchorChar: meta.anchorChar,
    turn: state.turn,
  });

  updateScore();
  renderHistory();
  clearSelection();
  $('idiomInput').value = '';
  refreshGrid();
  showMessage(`✓ ${idiom}`, 'success', 1500);
  startTimer();
  return true;
}

// 拖曳模式：直接從 path 算 meta 資訊
function submitAnswerWithPath(idiom, path) {
  // 計算方向（從 path[0] 到 path[1] 的向量）
  const dx = path[1].x - path[0].x;
  const dy = path[1].y - path[0].y;
  let direction = null;
  for (const [k, v] of Object.entries(DIRECTIONS)) {
    if (v.dx === dx && v.dy === dy) { direction = k; break; }
  }
  // 找出共用字（路徑上第一個已有字的位置）
  let anchorPos = null, anchorChar = null;
  for (let i = 0; i < 4; i++) {
    const existing = state.board[path[i].y][path[i].x];
    if (existing) { anchorPos = i + 1; anchorChar = existing.char; break; }
  }
  commitIdiom(idiom, path, { direction, anchorPos, anchorChar });
}

// 手動模式：原本的 submitAnswer
function submitAnswer() {
  const idiom = $('idiomInput').value.trim();

  if (!state.anchor) return showMessage('請先在字盤上點一個字', 'error');
  if (!state.anchorPos) return showMessage('請指定共用字是第幾字', 'error');
  if (!state.direction) return showMessage('請選擇延伸方向', 'error');
  if (idiom.length !== 4) return showMessage('請輸入四個字', 'error');

  // 共用字字元一致性（手動模式特有檢查）
  const sharedChar = idiom[state.anchorPos - 1];
  if (sharedChar !== state.anchor.char) {
    return showMessage(
      `第 ${state.anchorPos} 字是「${sharedChar}」，與共用字「${state.anchor.char}」不符`,
      'error'
    );
  }

  const { x: ax, y: ay } = state.anchor;
  const { dx, dy } = DIRECTIONS[state.direction];
  const startX = ax - dx * (state.anchorPos - 1);
  const startY = ay - dy * (state.anchorPos - 1);
  const positions = [];
  for (let i = 0; i < 4; i++) {
    positions.push({ x: startX + dx * i, y: startY + dy * i });
  }

  commitIdiom(idiom, positions, {
    direction: state.direction,
    anchorPos: state.anchorPos,
    anchorChar: state.anchor.char,
  });
}

// ====== 啟動 ======
function init() {
  prepareIdioms();
  renderGrid();
  startGame();
  $('loading').classList.add('hidden');
  console.log(`載入 ${IDIOM_LIST.length} 個成語。`);
}

document.addEventListener('DOMContentLoaded', init);
</script>
